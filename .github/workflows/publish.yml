name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '^1.27'
      - name: Build
        run: go run build.go
        env:
          BUILD_REPO: ${{ github.repository }}
      - name: Create Release
        run: |
          VERSION=$(head -n 1 bin/version.txt)
          TAG="v$(head -n 1 bin/version.txt | cut -d- -f1)"
          if gh release view "$TAG" --repo ${{ github.repository }} &>/dev/null; then
            gh release delete "$TAG" --yes --cleanup-tag --repo ${{ github.repository }}
          fi
          gh release create "$TAG" --repo ${{ github.repository }} \
            --title "pw $VERSION" \
            bin/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
